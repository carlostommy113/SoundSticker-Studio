name: Build SoundSticker Studio APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > release.keystore
          echo "Keystore decoded OK ($(stat -c%s release.keystore) bytes)"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon > build.log 2>&1 || {
            echo "DEBUG BUILD FAILED!"
            tail -n 80 build.log
            exit 1
          }

          ./gradlew assembleRelease --stacktrace --no-daemon >> build.log 2>&1 || {
            echo "RELEASE BUILD FAILED!"
            tail -n 80 build.log
            exit 1
          }

          echo "BUILD SUCCEEDED!"
          find . -name "*.apk"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Prepare APK artifacts
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$DEBUG_APK" ] || [ -z "$RELEASE_APK" ]; then
            echo "ERROR: APK not found!"
            find app/build -name "*.apk" || true
            exit 1
          fi

          mkdir -p output_apks
          cp "$DEBUG_APK"   output_apks/SoundStickerStudio-debug.apk
          cp "$RELEASE_APK" output_apks/SoundStickerStudio-release.apk
          ls -la output_apks/

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | tail -n1)/apksigner verify -v output_apks/SoundStickerStudio-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundStickerStudio-Debug-APK
          path: output_apks/SoundStickerStudio-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundStickerStudio-Release-APK
          path: output_apks/SoundStickerStudio-release.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${{ github.ref_name }}" \
            output_apks/SoundStickerStudio-release.apk \
            --title "SoundSticker Studio ${{ github.ref_name }}" \
            --notes "APK oficial firmado y compilado por GitHub Actions. Compatible con stickers con sonido de WhatsApp."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
