name: Build SoundSticker Studio APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # Necesario para crear la release

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # 1️⃣ Preparación del entorno
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # -------------------------------------------------
      # 2️⃣ Compilación (debug + release)
      # -------------------------------------------------
      - name: Build Debug & Release APKs
        run: |
          # Debug (para pruebas rápidas)
          ./gradlew assembleDebug --stacktrace --no-daemon > build.log 2>&1 || {
            echo "GRADLE DEBUG BUILD FAILED!"
            exit 1
          }

          # Release firmado (usa el keystore que ya está configurado en el workflow)
          ./gradlew assembleRelease --stacktrace --no-daemon >> build.log 2>&1 || {
            echo "GRADLE RELEASE BUILD FAILED!"
            exit 1
          }

          echo "GRADLE BUILD SUCCEEDED!"
          find . -name "*.apk"

      # -------------------------------------------------
      # 3️⃣ Subida de logs (para depuración)
      # -------------------------------------------------
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # -------------------------------------------------
      # 4️⃣ Preparar los APKs como artefactos
      # -------------------------------------------------
      - name: Prepare APK artifacts
        run: |
          # Debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          # Release APK (firmado)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$DEBUG_APK" ] || [ -z "$RELEASE_APK" ]; then
            echo "ERROR: No se encontró alguno de los APKs."
            exit 1
          fi

          mkdir -p output_apks
          cp "$DEBUG_APK"  output_apks/SoundStickerStudio-debug.apk
          cp "$RELEASE_APK" output_apks/SoundStickerStudio-release.apk

          echo "APK list:"
          ls -la output_apks/

      # -------------------------------------------------
      # 5️⃣ Subir los APKs como artefactos (para descarga manual)
      # -------------------------------------------------
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundStickerStudio-Debug-APK
          path: output_apks/SoundStickerStudio-debug.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundStickerStudio-Release-APK
          path: output_apks/SoundStickerStudio-release.apk
          retention-days: 30

      # -------------------------------------------------
      # 6️⃣ Crear / actualizar la GitHub Release (solo en tags v*)
      # -------------------------------------------------
      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${{ github.ref_name }}" \
            output_apks/SoundStickerStudio-release.apk \
            --title "SoundSticker Studio ${{ github.ref_name }}" \
            --notes "APK oficial compilado automáticamente por GitHub Actions para Android. Compatible con stickers con sonido de WhatsApp."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
