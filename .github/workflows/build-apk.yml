name: Build SoundSticker Studio APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon > build.log 2>&1 || {
            echo "GRADLE ASSEMBLE FAILED! Pushing build.log to ci-build-logs branch..."
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git checkout -B ci-build-logs
            git add build.log
            git commit -m "chore: ci build failure log" || true
            git push -f origin ci-build-logs || true
            tail -n 100 build.log
            exit 1
          }
          echo "GRADLE ASSEMBLE SUCCEEDED!"
          ls -la build.log
          find . -name "*.apk"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Verify APK Generation
        run: |
          echo "Listing all generated APKs:"
          find . -name "*.apk"
          APK_FILE=$(find app/build -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Selected APK: $APK_FILE"
          mkdir -p output_apks
          cp "$APK_FILE" output_apks/SoundStickerStudio-debug.apk
          ls -la output_apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundStickerStudio-Debug-APK
          path: output_apks/SoundStickerStudio-debug.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${{ github.ref_name }}" output_apks/SoundStickerStudio-debug.apk \
            --title "SoundSticker Studio ${{ github.ref_name }}" \
            --notes "APK oficial compilado automáticamente por GitHub Actions para Android. Compatible con stickers con sonido de WhatsApp."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
